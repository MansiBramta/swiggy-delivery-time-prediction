name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-api.txt pytest httpx2

      - name: Run tests
        run: python -m pytest

      - name: Build Docker image
        run: docker build -t swiggy-api .